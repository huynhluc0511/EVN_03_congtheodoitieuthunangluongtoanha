<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kích hoạt tài khoản · EVN-03</title><link rel="stylesheet" href="/static/style.css"></head><body class="login-body"><div class="login-card"><div class="brand login-brand"><div class="brand-mark">E</div><div><b>EVN-03</b><small>ENERGY PORTAL</small></div></div><p class="eyebrow">ACCOUNT ACTIVATION</p><h1>Kích hoạt tài khoản</h1><p class="muted">Nhập tên đăng nhập, mã kích hoạt trong EmailOutbox và đặt mật khẩu mới.</p>{% if error %}<div class="alert error">{{error}}</div>{% endif %}{% if message %}<div class="notice">{{message}}</div>{% endif %}<form method="post" action="/activate"><label>Tên đăng nhập</label><input name="username" required><label>Mã kích hoạt</label><input name="token" required maxlength="20"><label>Mật khẩu mới</label><input name="password" type="password" required minlength="8"><label>Xác nhận mật khẩu</label><input name="confirm_password" type="password" required minlength="8"><button class="primary full" type="submit">Kích hoạt tài khoản →</button></form><div class="login-note"><a href="/login">Quay lại đăng nhập</a></div></div></body></html>
