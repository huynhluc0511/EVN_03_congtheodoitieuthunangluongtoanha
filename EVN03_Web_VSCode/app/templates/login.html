<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập · EVN-03</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login-body"><div class="login-card"><div class="brand login-brand"><div class="brand-mark">E</div><div><b>EVN-03</b><small>ENERGY PORTAL</small></div></div><p class="eyebrow">BUILDING ENERGY MANAGEMENT</p><h1>Đăng nhập hệ thống</h1><p class="muted">Quản lý, giám sát và phân tích tiêu thụ năng lượng tòa nhà.</p>
